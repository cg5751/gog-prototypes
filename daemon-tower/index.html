<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b080c">
<title>악마의 탑 시제품 4</title>
<style>
:root{
  --bg:#0b080c; --panel:#171118; --panel2:#221925; --ink:#f1e7df; --muted:#a3949b; --line:#3b2c33;
  --blood:#c9302c; --ember:#ff7a2f; --gold:#f2c14e; --soul:#59c8ff;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;margin:0 auto;overflow:hidden;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.layer[hidden]{display:none}
.dim{background:rgba(8,5,9,.8)}
.box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}
h1{margin:0;font-size:36px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--blood)}
h2{margin:0 0 6px;font-size:22px}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.txt{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.55}
.btn{display:block;width:100%;margin-top:10px;padding:13px 14px;border:0;border-radius:10px;font:inherit;font-weight:700;font-size:16px;background:var(--blood);color:#fff;cursor:pointer}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.gold{background:var(--gold);color:#2a1d05}
.btn:disabled{opacity:.4;cursor:default}
.btn[hidden]{display:none}
.row{display:flex;gap:8px;margin-top:10px}
.tog{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.tog b{color:var(--gold)}
.ups{margin-top:12px;display:grid;gap:8px;text-align:left}
.ups .goldline{margin:0;text-align:center}
.up{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.up small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.up button{padding:8px 10px;border-radius:8px;border:0;background:var(--gold);color:#2a1d05;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.up button:disabled{opacity:.35;cursor:default}
.goldline{margin-top:12px;font-weight:700;color:var(--gold)}
.cards{display:grid;gap:10px;margin-top:12px}
.card{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;cursor:pointer}
.card:active{border-color:var(--gold)}
.card .ic{font-size:26px;text-align:center}
.card b{display:block;font-size:15px}
.card small{display:block;color:var(--muted);font-size:13px;margin-top:3px;line-height:1.4}
.stat{margin-top:8px;font-size:14px;line-height:1.6}
.card .pr{font-weight:800;color:var(--soul);font-size:13px;white-space:nowrap}
.card:disabled{opacity:.45;cursor:default}
.card.bought{border-color:var(--gold)}
.card.bought .pr{color:var(--gold)}
.wide{width:100%;margin-top:10px}
.tog:disabled{opacity:.45;cursor:default}
#quit{position:absolute;top:10px;right:10px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(23,17,24,.75);color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
#quit[hidden]{display:none}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <button id="quit" type="button" hidden>나가기</button>

  <section class="layer" id="menu">
    <div class="box">
      <h1>악마의 <em>탑</em></h1>
      <p class="sub">시제품 4판</p>
      <p class="txt">화면 아무 곳이나 끌어서 움직이고, 멈추면 자동으로 공격해요.<br>빛나는 임프를 잡으면 악마의 힘으로 한 단계씩 변신해요.<br>30초마다 제단에서 영혼을 불려 능력을 사요.</p>
      <button class="btn" id="startBtn" type="button">탑 오르기</button>
      <div class="row">
        <button class="tog" id="scrollTog" type="button"></button>
        <button class="tog" id="soundTog" type="button"></button>
      </div>
      <div class="ups" id="upMenu"></div>
      <p class="sub" id="recLine"></p>
    </div>
  </section>

  <section class="layer dim" id="shop" hidden>
    <div class="box">
      <h2 id="shopTitle">제단</h2>
      <p class="goldline" id="shopSouls"></p>
      <button class="btn gold" id="pourAgain" type="button">광고 보고 한 번 더 붓기</button>
      <div class="cards" id="cards"></div>
      <button class="tog wide" id="rerollBtn" type="button"></button>
      <button class="btn" id="goBtn" type="button">싸우러 가기</button>
    </div>
  </section>

  <section class="layer dim" id="dead" hidden>
    <div class="box">
      <h2>쓰러졌어요</h2>
      <p class="stat" id="deadStat"></p>
      <button class="btn gold" id="reviveBtn" type="button">광고 보고 부활 (변신 단계 유지)</button>
      <button class="btn" id="retryBtn" type="button">처음부터</button>
      <button class="btn alt" id="deadMenu" type="button">메뉴</button>
    </div>
  </section>

  <section class="layer dim" id="win" hidden>
    <div class="box">
      <h2 id="winTitle">1층 클리어!</h2>
      <p class="stat" id="winStat"></p>
      <p class="goldline" id="winGold"></p>
      <button class="btn gold" id="doubleBtn" type="button">광고 보고 보상 2배</button>
      <div class="ups" id="upWin"></div>
      <button class="btn" id="againBtn" type="button">다음 층으로</button>
      <button class="btn alt" id="winMenu" type="button">메뉴</button>
    </div>
  </section>

  <section class="layer dim" id="ad" hidden>
    <div class="box"><h2>광고 재생 중…</h2><p class="sub">시제품이라 흉내만 내요</p></div>
  </section>
</div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const hyp = Math.hypot;
const fmtT = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

const C = {
  floor: '#191216', seam: '#261b20', wall: '#0e090c', brick: '#20161c',
  ink: '#f1e7df', muted: '#a3949b', blood: '#c9302c', ember: '#ff7a2f', gold: '#f2c14e', soul: '#59c8ff',
  imp: '#c7392f', caster: '#7d4bc9', boss: '#5c0e17'
};

/* ---------- 저장 ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const save = Object.assign({ gold: 0, wLv: 0, aLv: 0, clears: 0, best: 0, maxFloor: 0, scroll: true, sound: true }, store.get('dt1_save', {}));
const persist = () => store.set('dt1_save', save);

/* ---------- 소리 ---------- */
let actx = null;
function ensureAudio() {
  if (!save.sound) return;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, d, type, v, f2, delay) {
  if (!actx || !save.sound) return;
  try {
    const t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v || 0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const sfx = {
  shoot() { tone(880, 0.04, 'square', 0.012, 620); },
  kill() { tone(520, 0.08, 'triangle', 0.05, 900); },
  hurt() { tone(170, 0.22, 'sawtooth', 0.07, 70); },
  level() { [523, 659, 784].forEach((f, i) => tone(f, 0.18, 'triangle', 0.07, 0, i * 0.07)); },
  stage() { tone(70, 0.7, 'sawtooth', 0.1, 35); [392, 523, 659, 784].forEach((f, i) => tone(f, 0.32, 'square', 0.04, 0, i * 0.08)); },
  warn() { for (let i = 0; i < 3; i++) tone(110, 0.28, 'sawtooth', 0.08, 70, i * 0.4); },
  fire() { tone(300, 0.12, 'sawtooth', 0.03, 170); },
  dash() { tone(140, 0.45, 'sawtooth', 0.07, 55); },
  stun() { tone(660, 0.1, 'triangle', 0.06, 330); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.08, 0, i * 0.12)); }
};

/* ---------- 화면 ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 1, H = 1, u = 1, vig = null;
function resize() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, r.width); H = Math.max(1, r.height); u = W;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.72)');
}
window.addEventListener('resize', resize);
const glowCache = {};
function glow(x, y, r, color, a) {
  let s = glowCache[color];
  if (!s) {
    s = document.createElement('canvas'); s.width = s.height = 64;
    const g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); glowCache[color] = s;
  }
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = a === undefined ? 1 : a;
  ctx.drawImage(s, x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

/* ---------- 게임 데이터 ---------- */
const ABIL = [
  { id: 'multi', icon: '⇈', name: '두 갈래 발사', desc: '한 번에 나가는 공격이 1발 늘어나요', max: 2 },
  { id: 'back', icon: '⇅', name: '앞뒤 발사', desc: '뒤쪽으로도 동시에 쏴요', max: 1 },
  { id: 'diag', icon: '⤧', name: '대각선 발사', desc: '양옆 대각선으로 1발씩 더 쏴요', max: 1 },
  { id: 'speed', icon: '⚡', name: '빠른 손', desc: '공격 속도가 빨라져요', max: 3 },
  { id: 'pierce', icon: '➶', name: '관통', desc: '공격이 적을 1마리 더 뚫고 지나가요', max: 2 },
  { id: 'burn', icon: '🔥', name: '불붙이기', desc: '맞은 적이 2초 동안 계속 피해를 입어요', max: 2 }
];
const EXTRA = [
  { id: 'heal', icon: '✚', name: '회복', desc: '체력을 40% 회복해요', max: 99 },
  { id: 'power', icon: '⚔', name: '힘', desc: '공격력이 10% 올라요', max: 99 }
];
const STAGE = [
  { name: '기본', scale: 1, atk: 1, hp: 1 },
  { name: '1단계 각성', scale: 1.15, atk: 1.3, hp: 1 },
  { name: '2단계 각성', scale: 1.3, atk: 1.6, hp: 1.3 },
  { name: '불의 악마', scale: 1.6, atk: 2.2, hp: 1.6 }
];
const BOSS_HP = 12000, GLOW_AT = [45, 75, 110], ALTAR_AT = [30, 60, 90, 120, 150];
const SOUL = { imp: 1, caster: 3, glow: 5 };
const THEMES = [
  { name: '불타는 입구', floor: '#191216', seam: '#261b20', torch: 'rgba(255,122,47,0.5)', core: '#ffb36b', fire: 'rgba(255,80,20,0.85)', fireCore: '#ffd2a0', bossGlow: 'rgba(170,20,30,0.65)' },
  { name: '푸른 불꽃의 회랑', floor: '#10141c', seam: '#1b2230', torch: 'rgba(80,160,255,0.55)', core: '#9fd0ff', fire: 'rgba(70,140,255,0.85)', fireCore: '#cfe6ff', bossGlow: 'rgba(40,80,200,0.65)' },
  { name: '보랏빛 심연', floor: '#150f1c', seam: '#231a30', torch: 'rgba(190,90,255,0.55)', core: '#e0b8ff', fire: 'rgba(200,80,255,0.85)', fireCore: '#f0d8ff', bossGlow: 'rgba(120,30,200,0.65)' }
];
const TH = () => THEMES[((G.floor || 1) - 1) % THEMES.length];
const FM = () => 1 + 0.5 * ((G.floor || 1) - 1);   // 층마다 적 체력 증가
const GM = () => 1 + 0.3 * ((G.floor || 1) - 1);

/* ---------- 상태 ---------- */
const G = { state: 'menu', bgY: 0, t: 0 };
const joy = { on: false, id: null, sx: 0, sy: 0, x: 0, y: 0 };
const stack = id => (G.ab && G.ab[id]) || 0;
const hpOf = st => Math.round(100 * (1 + 0.15 * save.aLv) * STAGE[st].hp);
const atkOf = () => 10 * (1 + 0.12 * save.wLv) * STAGE[G.hero.stage].atk * G.pow;
const heroR = () => u * 0.045 * STAGE[G.hero.stage].scale;
const WALL = () => u * 0.06;

function newRun() {
  Object.assign(G, {
    state: 'play', t: 0, bgY: 0, scroll: save.scroll, phase: 'run', warnT: 0,
    hero: { x: W / 2, y: H * 0.78, hp: 0, maxHp: 0, inv: 1, cd: 0.3, face: -Math.PI / 2, moving: false, stage: 0 },
    ab: {}, pow: 1, souls: 0, fresh: 0, altarIdx: 0, buys: 0, rerolls: 0, alt: null, transT: 0, shopCards: [],
    en: [], hb: [], eb: [], orbs: [], parts: [], texts: [], rings: [],
    boss: null, glowDone: [false, false, false], spImp: 0.8, spCaster: 0,
    slow: 0, flash: 0, flashC: C.blood, shake: 0,
    gold: 0, kills: 0, revived: false, banked: false, hint: 5, missed: 0, endT: 0, winTotal: 0, floor: 1, card: 2.6, story: null, bubbles: []
  });
  G.hero.maxHp = hpOf(0); G.hero.hp = G.hero.maxHp;
  joy.on = false;
}

/* ---------- 조작: 아무 곳이나 끌기 ---------- */
function pos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  if (G.state === 'altar') {
    e.preventDefault(); ensureAudio();
    const A = G.alt;
    if (A && A.phase === 'aim') { A.hold = true; A.idle = 0; A.tx = clamp(pos(e)[0], W * 0.1, W * 0.9); }
    return;
  }
  if (G.state === 'play' && G.phase === 'story') { e.preventDefault(); storyTap(); return; }
  if (G.state !== 'play' || joy.on) return;
  e.preventDefault(); ensureAudio();
  const [x, y] = pos(e);
  Object.assign(joy, { on: true, id: e.pointerId, sx: x, sy: y, x, y });
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (G.state === 'altar') { const A = G.alt; if (A && A.hold && A.phase === 'aim') { A.tx = clamp(pos(e)[0], W * 0.1, W * 0.9); A.idle = 0; } return; }
  if (!joy.on || e.pointerId !== joy.id) return;
  const [x, y] = pos(e); joy.x = x; joy.y = y;
  const R = u * 0.14, dx = x - joy.sx, dy = y - joy.sy, d = hyp(dx, dy);
  if (d > R) { joy.sx = x - dx / d * R; joy.sy = y - dy / d * R; }
});
const endJoy = e => {
  if (G.state === 'altar') { const A = G.alt; if (A && A.hold) { A.hold = false; startPour(); } return; }
  if (e.pointerId === joy.id) joy.on = false;
};
cv.addEventListener('pointerup', endJoy);
cv.addEventListener('pointercancel', endJoy);

/* ---------- 만들기 ---------- */
function addText(x, y, s, c, size, life) { G.texts.push({ x, y, s, c: c || C.ink, size: size || 14, t: 0, life: life || 0.8 }); }
function burst(x, y, c, n, sp) {
  for (let i = 0; i < n; i++) { const a = rand(0, TAU), s = rand(sp * 0.3, sp); G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rand(0.3, 0.6), c, s: rand(2, 4) }); }
}
function spawnImp(x, y) {
  G.en.push({ type: 'imp', x, y, r: u * 0.03, hp: (G.t < 90 ? 20 : 26) * FM(), maxHp: 20, spd: u * rand(0.24, 0.3), t: 0, flash: 0, burnT: 0, burnDps: 0 });
}
function spawnCaster() {
  const w = WALL();
  G.en.push({ type: 'caster', x: rand(w + u * 0.08, W - w - u * 0.08), y: -u * 0.06, ty: rand(H * 0.14, H * 0.38), r: u * 0.036, hp: 45 * FM(), maxHp: 45 * FM(), cd: rand(1.2, 2), tele: false, t: 0, flash: 0, burnT: 0, burnDps: 0 });
}
function spawnGlow() {
  G.en.push({ type: 'glow', x: W / 2, y: -u * 0.06, bx: rand(W * 0.35, W * 0.65), r: u * 0.034, hp: 40 * GM(), maxHp: 40 * GM(), t: 0, mode: 'enter', wt: 0, flash: 0, burnT: 0, burnDps: 0 });
  addText(W / 2, H * 0.3, '빛나는 임프가 나타났어요!', C.gold, 18, 1.8);
}
function shoot(x, y, a, sp, dmg, r) { G.eb.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dmg, r, dead: false }); }

/* ---------- 영웅 공격 ---------- */
function nearestTarget() {
  const h = G.hero; let best = null, bd = 1e9;
  for (const e of G.en) { if (e.dead || e.y < -e.r) continue; const d = hyp(e.x - h.x, e.y - h.y); if (d < bd) { bd = d; best = e; } }
  const B = G.boss;
  if (B && B.active && B.entering <= 0) { const d = hyp(B.x - h.x, B.y - h.y) - B.r; if (d < bd) best = B; }
  return best;
}
function fire(tg) {
  const h = G.hero, a = Math.atan2(tg.y - h.y, tg.x - h.x), hr = heroR(); h.face = a;
  const demon = h.stage === 3, n = 1 + stack('multi');
  const list = [{ d: a, n }];
  if (stack('back')) list.push({ d: a + Math.PI, n });
  if (stack('diag')) list.push({ d: a - 0.45, n: 1 }, { d: a + 0.45, n: 1 });
  const sp = u * (demon ? 1.25 : 1.5), r = u * (demon ? 0.024 : 0.012), dmg = atkOf();
  for (const s of list) for (let i = 0; i < s.n; i++) {
    const off = (i - (s.n - 1) / 2) * u * 0.035, px = Math.cos(s.d + Math.PI / 2) * off, py = Math.sin(s.d + Math.PI / 2) * off;
    G.hb.push({ x: h.x + px + Math.cos(s.d) * hr * 0.8, y: h.y + py + Math.sin(s.d) * hr * 0.8, vx: Math.cos(s.d) * sp, vy: Math.sin(s.d) * sp, r, dmg, pierce: stack('pierce'), hit: [], demon, life: 1.6 });
  }
  sfx.shoot();
}

/* ---------- 피해 ---------- */
function hitEnemy(e, dmg, b) {
  e.hp -= dmg; e.flash = 0.08;
  if (stack('burn')) { e.burnT = 2; e.burnDps = 0.3 * atkOf() * stack('burn'); }
  burst(e.x, e.y, '#ffd9b0', 3, u * 0.25);
  if (b && b.demon) {
    const R = u * 0.075;
    G.rings.push({ x: e.x, y: e.y, r: R, t: 0, life: 0.25, c: C.ember });
    for (const o of G.en) if (o !== e && !o.dead && hyp(o.x - e.x, o.y - e.y) < R + o.r) { o.hp -= dmg * 0.5; o.flash = 0.08; if (o.hp <= 0) kill(o); }
  }

  h.hp = Math.round(h.maxHp * 0.7); h.inv = 2.5; G.revived = true; G.eb = [];
  for (const e of G.en) if (e.type === 'imp' && hyp(e.x - h.x, e.y - h.y) < u * 0.35) e.dead = true;
  if (G.boss && G.boss.active && G.boss.state === 'charge') { G.boss.state = 'return'; }
  G.rings.push({ x: h.x, y: h.y, r: u * 0.4, t: 0, life: 0.6, c: C.gold });
  show('#dead', false); G.state = 'play';
}
function showAd(cb) { show('#ad', true); setTimeout(() => { show('#ad', false); cb(); }, 1200); }
function showWin() {
  G.state = 'win'; joy.on = false;
  const chest = 100 + randi(0, 50), total = G.gold + chest;
  G.winTotal = total; G.banked = true;
  save.gold += total; save.clears++; save.best = save.best ? Math.min(save.best, G.t) : G.t; save.maxFloor = Math.max(save.maxFloor || 0, G.floor); persist();
  $('#winTitle').textContent = G.floor + '층 클리어!';
  $('#winStat').innerHTML = '걸린 시간 ' + fmtT(G.t) + '<br>변신 ' + G.hero.stage + '단계, 능력 ' + G.buys + '개, 처치 ' + G.kills + '마리';
  $('#winGold').textContent = '처치 골드 ' + G.gold + ' + 보물 상자 ' + chest + ' = ' + total + ' 골드';
  const db = $('#doubleBtn'); db.disabled = false; db.textContent = '광고 보고 보상 2배';
  renderUps('#upWin'); show('#win', true);
}

$('#startBtn').addEventListener('click', startRun);
$('#quit').addEventListener('click', toMenu);
$('#scrollTog').addEventListener('click', () => { save.scroll = !save.scroll; persist(); refreshMenu(); });
$('#soundTog').addEventListener('click', () => { save.sound = !save.sound; persist(); if (save.sound) ensureAudio(); refreshMenu(); });
$('#upMenu').addEventListener('click', onUp);
$('#upWin').addEventListener('click', onUp);
$('#reviveBtn').addEventListener('click', () => showAd(revive));
$('#retryBtn').addEventListener('click', () => { bank(); startRun(); });
$('#deadMenu').addEventListener('click', toMenu);
$('#againBtn').addEventListener('click', nextFloor);
$('#winMenu').addEventListener('click', toMenu);
$('#doubleBtn').addEventListener('click', () => {
  const db = $('#doubleBtn');
  if (db.disabled) return;
  db.disabled = true;
  showAd(() => { save.gold += G.winTotal; persist(); db.textContent = '보상 2배 받음'; $('#winGold').textContent = '총 ' + G.winTotal * 2 + ' 골드를 받았어요'; renderUps('#upWin'); });
});

/* ---------- 시작 ---------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (G.state === 'play') update(rdt);
  else if (G.state === 'altar') updateAltar(rdt);
  else if (G.state === 'menu') G.bgY += rdt * u * 0.03;
  draw();
}
resize(); refreshMenu(); requestAnimationFrame(frame);
})();
</script>
